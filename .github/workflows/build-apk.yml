name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'IdleClicker30_AndroidStudio_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          mkdir -p work
          unzip -q IdleClicker30_AndroidStudio_Project.zip -d work

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd work/IdleClicker30
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IdleClicker30-APK
          path: work/IdleClicker30/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
